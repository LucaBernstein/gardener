apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

components:
- ../../components/kubeconfigs/seed-local2
# The force-restore component patches the Gardenlet by its base name (local), so it must be listed
# before the kind2 component, which renames the Gardenlet to local2.
- ../../components/force-restore
- ../../components/kind2
